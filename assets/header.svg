<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="Youssef Khafagy">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sweep">
      <rect x="-360" y="-40" width="360" height="300" fill="url(#fade)" transform="skewX(-14)">
        <animate attributeName="x" values="-360;1020;1020" keyTimes="0;0.4;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <rect width="880" height="200" fill="#0D1117"/>

  <rect x="48" y="42" width="60" height="60" rx="16" fill="#14100C" stroke="#2E2419" stroke-width="1"/>
  <path d="M68 62 L79 72 L68 82" fill="none" stroke="#F97316" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="79" width="14" height="3.2" rx="1.6" fill="#F97316">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.15s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>

  <text x="130" y="76" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="600" fill="#F0F6FC" letter-spacing="-0.8">Youssef Khafagy</text>
  <text x="132" y="102" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace" font-size="13.5" fill="#8B949E">Software engineering @ McMaster University</text>

  <g stroke="#3D444D" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M48 148 H470" stroke-dasharray="422" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="422;0" dur="1.5s" begin="0.2s" fill="freeze"/>
    </path>
    <path d="M205 148 Q225 148 225 160 Q225 172 245 172 H330 Q350 172 350 160 Q350 148 370 148 H390" stroke-dasharray="270" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="270;0" dur="1.2s" begin="0.9s" fill="freeze"/>
    </path>
  </g>

  <g fill="#0D1117" stroke="#4A5460" stroke-width="1.6">
    <circle cx="120" cy="148" r="4"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/></circle>
    <circle cx="205" cy="148" r="4"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1s" fill="freeze"/></circle>
    <circle cx="287" cy="172" r="4"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/></circle>
    <circle cx="390" cy="148" r="4"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/></circle>
  </g>

  <circle cx="470" cy="148" r="5.5" fill="#F97316">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.1s" fill="freeze"/>
  </circle>
  <circle cx="470" cy="148" r="5.5" fill="none" stroke="#F97316" stroke-width="1.4" opacity="0">
    <animate attributeName="r" values="5.5;17" dur="2.8s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0" dur="2.8s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <text x="492" y="152.5" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#8B949E" letter-spacing="0.3">AI/machine learning and full-stack development<animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze"/></text>

  <g mask="url(#sweep)">
    <text x="130" y="76" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="600" fill="#F97316" letter-spacing="-0.8">Youssef Khafagy</text>
    <text x="132" y="102" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace" font-size="13.5" fill="#FBBF7A">Software engineering @ McMaster University</text>
  </g>
</svg>
