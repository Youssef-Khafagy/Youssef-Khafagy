<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 168" width="880" height="168" role="img" aria-label="Youssef Khafagy">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sweep">
      <rect x="-340" y="-60" width="340" height="290" fill="url(#fade)" transform="skewX(-14)">
        <animate attributeName="x" values="-340;1000;1000" keyTimes="0;0.45;1" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <rect width="880" height="168" fill="#0D1117"/>
  <rect x="0" y="0" width="4" height="168" fill="#D2704A"/>

  <text x="48" y="70" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="600" fill="#F0F6FC" letter-spacing="-0.8">Youssef Khafagy</text>
  <text x="50" y="98" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace" font-size="13.5" fill="#8B949E">Software engineering @ McMaster University</text>
  <rect x="48" y="120" width="784" height="1" fill="#21262D"/>
  <text x="50" y="146" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#6E7681" letter-spacing="0.3">AI/machine learning and full-stack development</text>

  <g mask="url(#sweep)">
    <rect x="0" y="0" width="4" height="168" fill="#F2A183"/>
    <text x="48" y="70" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="600" fill="#D2704A" letter-spacing="-0.8">Youssef Khafagy</text>
    <text x="50" y="98" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace" font-size="13.5" fill="#E4A88C">Software engineering @ McMaster University</text>
    <rect x="48" y="120" width="784" height="1" fill="#D2704A"/>
    <text x="50" y="146" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#C9846A" letter-spacing="0.3">AI/machine learning and full-stack development</text>
  </g>
</svg>
